name: Sync base image (ACR -> Docker Hub)

# 低频:把 docker/build_base_aarch64.sh 推到 ACR 的 base 镜像搬一份到 Docker Hub。
# 之后 build-arm64-app.yml 从 Docker Hub 拉 base —— GitHub 国外 runner 拉
# Docker Hub 比拉上海 ACR 快一个量级(LightX2V 实测:ACR 17min vs Docker Hub 3.5min,
# 更早的 base 甚至要 38min)。只在 base 重建后跑一次。
#
# 与 LightX2V 的同名流水线逻辑一致,只换了仓名。
on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: '要同步的 base tag(浮动 tag 或带时间戳的不变 tag 都可以)'
        default: 'arm64-sm80-base'
        required: true

env:
  ACR_REPO: crpi-xzr81d0490mc3794.cn-shanghai.personal.cr.aliyuncs.com/reputationly/vllm-backport
  DOCKERHUB_REPO: arronlee/vllm-backport

jobs:
  sync:
    # registry 间直传,与镜像架构无关,标准 x86 runner 即可。
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Set up crane
        uses: imjasonh/setup-crane@v0.4

      # 源 ACR 仓公开则拉取无需登录;若设了私有,补一条 crane auth login ACR。
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
            | crane auth login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Copy base ACR -> Docker Hub
        run: |
          set -x
          crane copy \
            "${ACR_REPO}:${{ github.event.inputs.base_tag }}" \
            "${DOCKERHUB_REPO}:${{ github.event.inputs.base_tag }}"
